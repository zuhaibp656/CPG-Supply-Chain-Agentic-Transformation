<!DOCTYPE html>
<html lang="en" class="theme-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Persona &amp; Agent Suite — CPG Supply Chain Agentic Transformation</title>
<link rel="icon" href="../assets/media/brand/gemini_spark_fullcolor_768.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script>
try {
  var saved = localStorage.getItem('deck-theme') || 'light';
  document.documentElement.className = (saved === 'dark') ? 'theme-dark' : 'theme-light';
} catch (e) {}
</script>
<style>
  :root {
    --g-blue: #3186FF; --g-purple: #4B31E3; --g-green: #00AF57; --green-ink: #007F3F;
    --g-cyan: #12B5CB; --g-yellow: #FEC700; --g-red: #FC413D; --g-grey-1200: #121317;
    --canvas: #F0F5FE; --surface: #FFFFFF; --surface-sunk: #F1F3F9;
    --border: #E1E5EE; --border-strong: #CBD2E0;
    --text: #1F2430; --text-muted: #5A6275; --text-dim: #8A92A6;
    --accent: var(--g-blue); --accent-soft: rgba(49,134,255,.11);
    --shadow-sm: 0 2px 8px rgba(18,19,23,.05); --shadow-md: 0 8px 24px rgba(18,19,23,.09);
    --font: "Google Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: "Roboto Mono", ui-monospace, monospace;
    --wrap: 1380px;
  }
  html.theme-dark {
    --canvas: #121317; --surface: #1A1C22; --surface-sunk: #15171C;
    --border: #2A2D36; --border-strong: #3A3E4A;
    --text: #ECEEF3; --text-muted: #A8AFC0; --text-dim: #757D91;
    --accent: #6BA6FF; --green-ink: #5BB974;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--canvas); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.52; overflow-x: hidden; }
  .wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 max(20px, 2.8vw); }

  /* Masthead */
  .masthead { position: sticky; top: 0; z-index: 60; background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
  .masthead-in { max-width: var(--wrap); margin: 0 auto; padding: 0 max(20px, 2.8vw); height: 56px; display: flex; align-items: center; gap: 14px; }
  .mast-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); }
  .mast-logo { height: 26px; width: auto; }
  .mast-div { width: 1px; height: 18px; background: var(--border-strong); }
  .mast-kicker { font: 700 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); }
  .mast-spacer { flex: 1; }
  .mast-nav { display: flex; align-items: center; gap: 10px; }
  .mast-btn { font: 600 12px var(--font); color: var(--text-muted); text-decoration: none; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
  .mast-btn:hover { border-color: var(--accent); color: var(--accent); }
  .mast-count { font: 700 13px var(--mono); color: var(--accent); }
  .mast-cta { font: 600 12px var(--font); text-decoration: none; color: var(--surface); background: var(--text); padding: 7px 15px; border-radius: 999px; }

  /* Compact Pillar & Persona Switcher (clean flow, zero clipping over Hero card) */
  .roster { position: relative; z-index: 40; background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 0 10px; }
  .domain-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .fchip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); cursor: pointer; font: 600 12px var(--font); transition: all .15s; }
  .fchip.is-on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .fsearch { margin-left: auto; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: 400 12px var(--font); min-width: 210px; }
  .strip { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .pchip { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 6px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font: 600 12px var(--font); transition: transform .15s, border-color .15s; }
  .pchip:hover { border-color: var(--accent); transform: translateY(-1px); }
  .pchip.is-on { border-color: var(--accent); background: var(--accent-soft); }
  .pchip-av { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font: 700 10px var(--font); color: #fff; }
  .pchip-sub { font-weight: 400; font-size: 11px; color: var(--text-dim); }

  /* macOS Genie Container Animation */
  .genie-stage {
    padding: 24px 0 64px;
    transform-origin: var(--gx, 50%) 0%;
  }
  .genie-stage.genie-enter {
    animation: genieUnfurl .48s cubic-bezier(.20, 1, .32, 1) forwards;
  }
  @keyframes genieUnfurl {
    0% {
      opacity: 0;
      transform: perspective(1100px) scaleX(0.14) scaleY(0.06) skewX(5deg) rotateX(12deg);
      filter: blur(7px);
    }
    58% {
      opacity: 1;
      transform: perspective(1100px) scaleX(1.012) scaleY(1.008) skewX(-0.5deg) rotateX(-1deg);
      filter: blur(0);
    }
    100% {
      opacity: 1;
      transform: perspective(1100px) scaleX(1) scaleY(1) skewX(0) rotateX(0);
      filter: blur(0);
    }
  }

  /* 1. Colorful Hero Card (Persona Role FIRST, Human Name + What They Do, 3 Vibrant KPI Tiles) */
  .hero-card {
    position: relative; overflow: hidden; border-radius: 24px; padding: 26px 28px;
    background: linear-gradient(135deg, color-mix(in srgb, var(--pc, #3186FF) 12%, var(--surface)) 0%, var(--surface) 58%, color-mix(in srgb, #4B31E3 8%, var(--surface)) 100%);
    border: 1.5px solid color-mix(in srgb, var(--pc, #3186FF) 32%, var(--border));
    box-shadow: var(--shadow-md);
    display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center;
  }
  .hero-card::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px;
    background: linear-gradient(90deg, #3186FF 0%, #4B31E3 35%, #00AF57 70%, #FEC700 100%);
  }
  @media (max-width: 880px) { .hero-card { grid-template-columns: 1fr; } }

  .hero-left { display: flex; gap: 20px; align-items: flex-start; }
  @media (max-width: 600px) { .hero-left { flex-direction: column; } }
  .portrait-badge {
    width: 76px; height: 76px; border-radius: 22px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font: 700 26px var(--font); color: #fff; background: var(--pc, #3186FF);
    box-shadow: 0 12px 26px color-mix(in srgb, var(--pc, #3186FF) 38%, transparent);
  }
  .meta-pills { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 8px; }
  .mpill { font: 700 10.5px var(--mono); padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); }
  .mpill.p0 { background: rgba(252,65,61,.12); border-color: rgba(252,65,61,.3); color: #C62A27; }
  html.theme-dark .mpill.p0 { color: #FCA5A5; }

  .role-h1 { font-size: clamp(26px, 2.8vw, 36px); font-weight: 700; letter-spacing: -.02em; margin: 0 0 4px; line-height: 1.12; }
  .human-sub { font-size: 15.5px; font-weight: 600; color: var(--pc, #3186FF); margin: 0 0 10px; }
  .human-sub span { color: var(--text-muted); font-weight: 500; }
  .what-desc { font-size: 14.5px; line-height: 1.56; color: var(--text); margin: 0 0 12px; max-width: 72ch; }
  .sys-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .sys-chip { font: 600 11px var(--mono); padding: 4px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); color: var(--text); }

  .kpi-stack { display: flex; gap: 12px; flex-wrap: wrap; }
  .kpi-box {
    min-width: 132px; padding: 14px 18px; border-radius: 18px; text-align: center;
    background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  }
  .kpi-box b { display: block; font-size: 22px; font-weight: 700; line-height: 1.15; margin-bottom: 2px; }
  .kpi-box span { font: 700 10px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); }

  /* 2. Animated How-Agents-Work Strip */
  .how-strip {
    margin-top: 18px; padding: 14px 20px; border-radius: 18px;
    background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm);
    display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; gap: 14px;
  }
  @media (max-width: 860px) { .how-strip { grid-template-columns: 1fr; } .how-conn { display: none; } }
  .how-step { display: flex; align-items: center; gap: 12px; }
  .how-num {
    width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    font: 700 12px var(--mono); color: #fff;
  }
  .how-step b { display: block; font-size: 13.5px; }
  .how-step span { font-size: 12px; color: var(--text-muted); }
  .how-conn { width: 58px; height: 14px; }
  .how-conn path { fill: none; stroke: var(--g-blue); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 2 9; animation: hFlow 1s linear infinite; }
  @keyframes hFlow { to { stroke-dashoffset: -22; } }

  /* 3. Colorful Highlighted Agentic Suite Grid */
  .suite-sec { margin-top: 22px; }
  .suite-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .suite-bar h2 { margin: 0; font-size: 21px; font-weight: 700; }
  .lever-pills { display: flex; flex-wrap: wrap; gap: 7px; }
  .lv-pill {
    font: 700 11px var(--mono); padding: 5px 11px; border-radius: 999px;
    background: color-mix(in srgb, var(--lc) 12%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--lc) 32%, transparent);
    color: var(--text);
  }
  .lv-pill b { color: var(--lc); }

  .suite-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 16px; }
  .ag-card {
    text-decoration: none; color: inherit; cursor: pointer;
    border-radius: 20px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px;
    background: linear-gradient(168deg, color-mix(in srgb, var(--ac) 11%, var(--surface)) 0%, var(--surface) 64%);
    border: 1.5px solid color-mix(in srgb, var(--ac) 34%, var(--border));
    border-top: 4.5px solid var(--ac);
    box-shadow: var(--shadow-sm);
    transition: transform .22s cubic-bezier(.22,1,.36,1), box-shadow .22s, border-color .2s;
  }
  .ag-card:hover { transform: translateY(-6px) scale(1.01); border-color: var(--ac); box-shadow: 0 18px 34px color-mix(in srgb, var(--ac) 22%, rgba(18,19,23,.10)); }
  .ag-card.is-focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--ac) 35%, transparent), var(--shadow-md); }

  .ag-badges { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .ab { font: 700 10px var(--mono); padding: 3px 9px; border-radius: 999px; }
  .ab-p0 { background: rgba(252,65,61,.14); color: #C62A27; }
  .ab-p1 { background: rgba(254,199,0,.22); color: #8A6200; }
  .ab-p2 { background: rgba(49,134,255,.14); color: #286DD1; }
  .ab-new { background: rgba(75,49,227,.14); color: #4B31E3; }
  .ab-live { background: rgba(0,175,87,.14); color: #007F3F; }
  html.theme-dark .ab-p0 { color: #FCA5A5; }
  html.theme-dark .ab-p1 { color: #FDE68A; }
  html.theme-dark .ab-new { color: #C4B5FD; }
  html.theme-dark .ab-live { color: #6EE7B7; }
  .ag-val { margin-left: auto; font: 700 14px var(--mono); color: var(--green-ink); }

  .ag-title { font-size: 19px; font-weight: 700; margin: 0; line-height: 1.22; }
  .ag-desc { font-size: 13.5px; color: var(--text-muted); line-height: 1.5; margin: 0; }

  .ag-highlights { display: flex; flex-direction: column; gap: 7px; }
  .ag-hl {
    padding: 8px 11px; border-radius: 11px; background: var(--surface-sunk);
    border-left: 3px solid var(--ac); font-size: 12.5px; line-height: 1.42;
  }
  .ag-hl b { font: 700 10.5px var(--mono); text-transform: uppercase; color: var(--ac); margin-right: 5px; }

  .ag-foot-link {
    margin-top: auto; padding-top: 10px; border-top: 1px dashed color-mix(in srgb, var(--ac) 28%, var(--border));
    display: flex; align-items: center; justify-content: space-between;
    font: 700 12.5px var(--font); color: var(--ac);
  }
  .ag-card:hover .ag-foot-link span:last-child { transform: translateX(3px); }
  .ag-foot-link span:last-child { transition: transform .18s; }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-in">
    <a class="mast-brand" href="index.html">
      <img class="mast-logo" src="../assets/media/wip/image25.png" alt="Google Cloud">
      <span class="mast-div"></span>
      <span class="mast-kicker">CPG Persona &amp; Agentic Suite</span>
    </a>
    <span class="mast-spacer"></span>
    <nav class="mast-nav">
      <button class="mast-btn" id="themeBtn" type="button">Dark</button>
      <a class="mast-btn" id="backPillar" href="../pages/pillar.html">&larr; Back to Pillar</a>
      <a class="mast-btn" id="backBoard" href="index.html">Persona Map</a>
      <span class="mast-count" id="counter">01 / 60</span>
      <a class="mast-cta" href="../index.html">All Slides &#8599;</a>
    </nav>
  </div>
</header>

<div class="roster">
  <div class="wrap">
    <div class="domain-row" id="domainRow"></div>
    <div class="strip" id="strip"></div>
  </div>
</div>

<main class="wrap">
  <div class="genie-stage" id="root"></div>
</main>

<script src="../data/sc_story_data.js"></script>
<script src="../data/sc_value_model.js"></script>
<script>
(function () {
  var DATA = window.SC_DATA;
  var fmtINR = window.SC_VALUES.fmtINR;
  var personas = DATA.personas;
  var depts = DATA.departments;

  var HUES = ['#3186FF', '#4B31E3', '#00AF57', '#0A7684'];

  var themeBtn = document.getElementById('themeBtn');
  function syncThemeBtn() { themeBtn.textContent = document.documentElement.classList.contains('theme-dark') ? 'Light' : 'Dark'; }
  syncThemeBtn();
  themeBtn.addEventListener('click', function () {
    var dark = document.documentElement.classList.toggle('theme-dark');
    document.documentElement.classList.toggle('theme-light', !dark);
    try { localStorage.setItem('deck-theme', dark ? 'dark' : 'light'); } catch (e) {}
    syncThemeBtn();
  });

  var qs = new URLSearchParams(location.search);
  var currentId = qs.get('id') || personas[0].id;
  var focusAgentId = qs.get('agent') || '';
  var activeDept = qs.get('dept') || 'all';
  var searchQuery = '';

  if (!personas.some(function (p) { return p.id === currentId; })) currentId = personas[0].id;

  function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function initials(name) {
    return String(name || '').split(/\s+/).slice(0, 2).map(function (w) { return w[0] || ''; }).join('').toUpperCase();
  }
  function concise(s, maxLen) {
    var txt = String(s || '').split(/\.\s+/)[0];
    if (txt.length > maxLen) return txt.slice(0, maxLen - 1) + '…';
    return txt.endsWith('.') ? txt : txt + '.';
  }

  function getFiltered() {
    return personas.filter(function (p) {
      if (activeDept !== 'all' && p.deptId !== activeDept) return false;
      if (!searchQuery) return true;
      var hay = (p.name + ' ' + p.personName + ' ' + p.subPillarName + ' ' + p.agentSuite.map(function (s) { return s.name; }).join(' ')).toLowerCase();
      return hay.indexOf(searchQuery) >= 0;
    });
  }

  function renderRoster() {
    var dHtml = '<button type="button" class="fchip' + (activeDept === 'all' ? ' is-on' : '') + '" data-dept="all">All 6 Pillars (' + personas.length + ')</button>';
    depts.forEach(function (d) {
      dHtml += '<button type="button" class="fchip' + (activeDept === d.id ? ' is-on' : '') + '" data-dept="' + d.id + '">' + d.num + ' · ' + esc(d.title) + '</button>';
    });
    dHtml += '<input type="search" class="fsearch" id="pSearch" placeholder="Search role, name or agent..." value="' + esc(searchQuery) + '">';
    var dRow = document.getElementById('domainRow');
    dRow.innerHTML = dHtml;

    dRow.querySelectorAll('.fchip').forEach(function (b) {
      b.addEventListener('click', function () {
        activeDept = b.dataset.dept;
        var filtered = getFiltered();
        if (filtered.length && !filtered.some(function (x) { return x.id === currentId; })) currentId = filtered[0].id;
        renderRoster();
        renderPersona('50%');
      });
    });
    document.getElementById('pSearch').addEventListener('input', function (e) {
      searchQuery = e.target.value.trim().toLowerCase();
      renderStripOnly();
    });
    renderStripOnly();
  }

  function renderStripOnly() {
    var list = getFiltered();
    var strip = document.getElementById('strip');
    strip.innerHTML = list.map(function (p) {
      return '<button type="button" class="pchip' + (p.id === currentId ? ' is-on' : '') + '" data-id="' + p.id + '">' +
        '<span class="pchip-av" style="background:' + p.deptColor + '">' + initials(p.personName) + '</span>' +
        '<span>' + esc(p.name) + ' <span class="pchip-sub">· ' + esc(p.personName) + '</span></span>' +
      '</button>';
    }).join('');
    strip.querySelectorAll('.pchip').forEach(function (b) {
      b.addEventListener('click', function () {
        var r = b.getBoundingClientRect();
        var originPct = Math.round(((r.left + r.width / 2) / window.innerWidth) * 100) + '%';
        currentId = b.dataset.id;
        focusAgentId = '';
        history.replaceState(null, '', '?id=' + encodeURIComponent(currentId) + (activeDept !== 'all' ? '&dept=' + activeDept : ''));
        renderStripOnly();
        renderPersona(originPct);
      });
    });
  }

  function renderPersona(originX) {
    var idx = personas.findIndex(function (x) { return x.id === currentId; });
    var p = personas[Math.max(0, idx)];
    var firstName = (p.personName || 'Leader').split(' ')[0];
    document.title = p.name + ' (' + p.personName + ') — CPG Agent Suite';
    document.getElementById('counter').textContent = p.code + ' / ' + personas.length;
    document.getElementById('backBoard').href = 'index.html' + (activeDept !== 'all' ? '?dept=' + encodeURIComponent(activeDept) : '');
    document.getElementById('backPillar').href = '../pages/pillar.html?dept=' + encodeURIComponent(p.deptId) + '&sub=' + encodeURIComponent(p.subPillarId || '');

    var v = p.val || { prod: 0.6, flow: 7.2, shield: 7.2, recov: 3.6, total: 18.6 };
    var suite = p.agentSuite || [];
    var sysList = String(p.systemsTouched || '').split('·').map(function (x) { return x.trim(); }).filter(Boolean);

    var cardsHtml = suite.map(function (a, i) {
      var ac = HUES[i % HUES.length];
      var pCls = a.priorityTier === 'P0' ? 'ab-p0' : (a.priorityTier === 'P1' ? 'ab-p1' : 'ab-p2');
      var pTxt = a.priorityTier === 'P0' ? 'P0 · Deploy First (' + a.paybackDays + 'd)' : (a.priorityTier === 'P1' ? 'P1 · Build Next' : 'P2 · Enabler');
      var isFocus = focusAgentId && a.id === focusAgentId;

      return '<a class="ag-card' + (isFocus ? ' is-focus' : '') + '" href="../pages/agent_blueprint.html?agent=' + encodeURIComponent(a.id) + '&persona=' + encodeURIComponent(p.id) + '" style="--ac:' + ac + ';animation-delay:' + (80 + i * 75) + 'ms">' +
        '<div class="ag-badges">' +
          '<span class="ab ' + pCls + '">' + pTxt + '</span>' +
          (a.isNewCpgAgent ? '<span class="ab ab-new">+ NEW CPG</span>' : '') +
          (a.liveInGE ? '<span class="ab ab-live">&#9679; Live in GE</span>' : '') +
          '<span class="ag-val">' + fmtINR(a.annualValueCr, '/yr') + '</span>' +
        '</div>' +
        '<h3 class="ag-title">' + esc(a.name) + '</h3>' +
        '<p class="ag-desc">' + esc(concise(a.oneLine, 160)) + '</p>' +
        '<div class="ag-highlights">' +
          '<div class="ag-hl"><b>How It Works:</b>' + esc(concise(a.does, 125)) + '</div>' +
          '<div class="ag-hl"><b>Human Gate:</b>' + esc(concise(a.stopsAt, 120)) + '</div>' +
        '</div>' +
        '<div class="ag-foot-link">' +
          '<span>Agent Architecture &amp; Tech Details</span>' +
          '<span>&rarr;</span>' +
        '</div>' +
      '</a>';
    }).join('');

    var root = document.getElementById('root');
    root.style.setProperty('--pc', p.deptColor);
    root.style.setProperty('--gx', originX || '50%');
    root.classList.remove('genie-enter');
    void root.offsetWidth;
    root.classList.add('genie-enter');

    root.innerHTML =
      '<section class="hero-card">' +
        '<div class="hero-left">' +
          '<div class="portrait-badge">' + initials(p.personName) + '</div>' +
          '<div>' +
            '<div class="meta-pills">' +
              '<span class="mpill">' + esc(p.code) + ' &middot; ' + esc(p.deptTitle) + '</span>' +
              '<span class="mpill">' + esc(p.subPillarName) + '</span>' +
              (p.priorityTier === 'P0' ? '<span class="mpill p0">Priority 0 · Immediate ROI</span>' : '') +
            '</div>' +
            '<h1 class="role-h1">' + esc(p.name) + '</h1>' +
            '<p class="human-sub">' + esc(p.personName) + ' <span>&middot; &#128205; ' + esc(p.setting) + '</span></p>' +
            '<p class="what-desc">' + esc(concise(p.whatTheyDo, 220)) + '</p>' +
            '<div class="sys-chips">' +
              sysList.map(function (s) { return '<span class="sys-chip">&#9889; ' + esc(s) + '</span>'; }).join('') +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="kpi-stack">' +
          '<div class="kpi-box"><b style="color:#00AF57">' + fmtINR(v.total, '/yr') + '</b><span>Annual Value</span></div>' +
          '<div class="kpi-box"><b style="color:#3186FF">' + p.toilHoursBefore + 'h &rarr; ' + p.toilHoursAfter + 'h</b><span>Weekly Toil</span></div>' +
          '<div class="kpi-box"><b style="color:#4B31E3">' + suite.length + ' Agents</b><span>Agentic Suite</span></div>' +
        '</div>' +
      '</section>' +

      '<section class="how-strip">' +
        '<div class="how-step"><span class="how-num" style="background:#3186FF">01</span><div><b>Live CPG Signals</b><span>' + esc(p.systemsTouched) + '</span></div></div>' +
        '<svg class="how-conn" viewBox="0 0 58 14"><path d="M 2 7 L 56 7"/></svg>' +
        '<div class="how-step"><span class="how-num" style="background:#4B31E3">02</span><div><b>' + suite.length + ' Specialized Agents Coordinate</b><span>Sense anomalies, run OR-Tools math &amp; prepare drafts</span></div></div>' +
        '<svg class="how-conn" viewBox="0 0 58 14"><path d="M 2 7 L 56 7"/></svg>' +
        '<div class="how-step"><span class="how-num" style="background:#00AF57">03</span><div><b>' + esc(firstName) + ' Approves in 1 Click</b><span>System of record stays untouched until human sign-off</span></div></div>' +
      '</section>' +

      '<section class="suite-sec">' +
        '<div class="suite-bar">' +
          '<h2>' + esc(firstName) + '\'s Agentic Suite (' + suite.length + ' Agents)</h2>' +
          '<div class="lever-pills">' +
            '<span class="lv-pill" style="--lc:#3186FF">Productivity <b>' + fmtINR(v.prod) + '</b></span>' +
            '<span class="lv-pill" style="--lc:#00AF57">Flow <b>' + fmtINR(v.flow) + '</b></span>' +
            '<span class="lv-pill" style="--lc:#4B31E3">Risk Shield <b>' + fmtINR(v.shield) + '</b></span>' +
            '<span class="lv-pill" style="--lc:#12B5CB">Recovery <b>' + fmtINR(v.recov) + '</b></span>' +
          '</div>' +
        '</div>' +
        '<div class="suite-grid">' + cardsHtml + '</div>' +
      '</section>';

    if (window.triggerIosMatrixEnter) {
      requestAnimationFrame(function () { window.triggerIosMatrixEnter(root); });
    }
  }

  renderRoster();
  renderPersona('50%');
})();
</script>
<script src="../assets/ios_transitions.js"></script>
</body>
</html>
