<!DOCTYPE html>
<html lang="en" class="theme-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Persona &amp; Agent Suite — CPG Supply Chain Agentic Transformation</title>
<link rel="icon" href="../assets/media/brand/gemini_spark_fullcolor_768.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script>
try {
  var saved = localStorage.getItem('deck-theme') || 'light';
  document.documentElement.className = (saved === 'dark') ? 'theme-dark' : 'theme-light';
} catch (e) {}
</script>
<style>
  :root {
    --g-blue: #3186FF; --g-purple: #4B31E3; --g-green: #00AF57; --green-ink: #007F3F;
    --g-cyan: #12B5CB; --g-yellow: #FEC700; --g-red: #FC413D; --g-grey-1200: #121317;
    --canvas: #F0F5FE; --surface: #FFFFFF; --surface-sunk: #F1F3F9;
    --border: #E1E5EE; --border-strong: #CBD2E0;
    --text: #1F2430; --text-muted: #5A6275; --text-dim: #8A92A6;
    --accent: var(--g-blue); --accent-soft: rgba(49,134,255,.10);
    --green-soft: rgba(0,175,87,.12); --purple-soft: rgba(75,49,227,.10);
    --red-soft: rgba(252,65,61,.11); --amber-soft: rgba(254,199,0,.18);
    --shadow-sm: 0 1px 2px rgba(18,19,23,.06); --shadow-md: 0 2px 8px rgba(18,19,23,.08); --shadow-lg: 0 8px 28px rgba(18,19,23,.12);
    --font: "Google Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: "Roboto Mono", ui-monospace, monospace;
    --radius: 14px; --wrap: 1440px;
  }
  html.theme-dark {
    --canvas: #121317; --surface: #1A1C22; --surface-sunk: #15171C;
    --border: #2A2D36; --border-strong: #3A3E4A;
    --text: #ECEEF3; --text-muted: #A8AFC0; --text-dim: #757D91;
    --accent: #6BA6FF; --green-ink: #5BB974;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--canvas); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.55; }
  .wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 max(20px, 2.5vw); }

  /* Masthead */
  .masthead { position: sticky; top: 0; z-index: 60; background: var(--surface); border-bottom: 1px solid var(--border); }
  .masthead-in { max-width: var(--wrap); margin: 0 auto; padding: 0 max(20px, 2.5vw); height: 56px; display: flex; align-items: center; gap: 14px; }
  .mast-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); }
  .mast-logo { height: 26px; width: auto; }
  .mast-div { width: 1px; height: 18px; background: var(--border-strong); }
  .mast-kicker { font: 700 11px var(--mono); letter-spacing: .13em; text-transform: uppercase; color: var(--text-muted); }
  .mast-spacer { flex: 1; }
  .mast-nav { display: flex; align-items: center; gap: 10px; }
  .mast-btn { font: 600 12px var(--font); color: var(--text-muted); text-decoration: none; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
  .mast-btn:hover { border-color: var(--accent); color: var(--accent); }
  .mast-count { font: 700 13px var(--mono); color: var(--accent); }
  .mast-cta { font: 600 12px var(--font); text-decoration: none; color: var(--surface); background: var(--text); padding: 7px 15px; border-radius: 999px; }

  /* Roster Strip */
  .roster { position: sticky; top: 56px; z-index: 50; background: color-mix(in srgb, var(--canvas) 93%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 10px 0; }
  .domain-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .fchip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); cursor: pointer; font: 500 12px var(--font); }
  .fchip.is-on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .fsearch { margin-left: auto; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: 400 12px var(--font); min-width: 210px; }
  .strip { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .pchip { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 5px 11px 5px 6px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font: 500 12px var(--font); }
  .pchip:hover { border-color: var(--accent); }
  .pchip.is-on { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .pchip-av { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font: 700 10px var(--font); color: #fff; }
  .pchip-sub { font-size: 11px; color: var(--text-dim); }

  /* Persona ID Card */
  .idcard { margin-top: 22px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 26px 28px; box-shadow: var(--shadow-sm); display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 26px; align-items: start; }
  @media (max-width: 720px) { .idcard { grid-template-columns: 1fr; } }
  .portrait-mono { width: 92px; height: 92px; border-radius: 22px; display: flex; align-items: center; justify-content: center; font: 700 30px var(--font); color: #fff; box-shadow: var(--shadow-md); margin-bottom: 14px; }
  .figure { padding-top: 12px; border-top: 1px solid var(--border); }
  .figure-key { font: 700 10px var(--mono); text-transform: uppercase; letter-spacing: .09em; color: var(--text-dim); }
  .figure-val { font: 700 26px/1.15 var(--font); color: var(--green-ink); margin: 3px 0; }
  .figure-sub { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
  .idmeta { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
  .tag { font: 600 11px var(--mono); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-sunk); color: var(--text-muted); }
  .tag-p0 { background: var(--red-soft); border-color: rgba(252,65,61,.35); color: #C62A27; }
  .tag-live { background: var(--green-soft); border-color: rgba(0,175,87,.35); color: var(--green-ink); }
  .idhead h1 { font-size: clamp(28px, 3vw, 38px); font-weight: 700; letter-spacing: -.02em; margin: 0 0 2px; line-height: 1.12; }
  .id-role { font-size: 17px; font-weight: 600; color: var(--accent); margin: 0 0 12px; }
  .id-line { font-size: 15px; line-height: 1.6; color: var(--text); margin: 0 0 12px; max-width: 82ch; }
  .id-mandate { padding: 12px 16px; border-radius: 10px; background: var(--surface-sunk); border-left: 3px solid var(--accent); font-size: 13.5px; color: var(--text-muted); margin-bottom: 10px; }
  .sys-line { font: 500 12px var(--mono); color: var(--text-dim); }
  .sys-line b { color: var(--text); }

  /* Section Blocks */
  .block { margin-top: 26px; }
  .section-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .section-head h2 { font-size: 21px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .section-note { font-size: 13px; color: var(--text-muted); }

  /* Agent Suite Cards (.squad) */
  .squad { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
  .agent { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; transition: border-color .15s, box-shadow .15s; }
  .agent:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); }
  .agent.is-open { grid-column: 1 / -1; border-color: var(--accent); box-shadow: var(--shadow-md); }
  .agent-head { width: 100%; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; padding: 18px 20px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; min-height: 168px; }
  .agent-badges { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 10px; }
  .badge-id { font: 700 10.5px var(--mono); padding: 3px 8px; border-radius: 6px; background: var(--surface-sunk); border: 1px solid var(--border); color: var(--text-muted); }
  .badge-p0 { font: 700 10.5px var(--mono); padding: 3px 8px; border-radius: 6px; background: var(--red-soft); color: #C62A27; }
  .badge-p1 { font: 700 10.5px var(--mono); padding: 3px 8px; border-radius: 6px; background: var(--amber-soft); color: #8A6200; }
  .badge-new { font: 700 10px var(--mono); padding: 3px 8px; border-radius: 6px; background: var(--purple-soft); color: var(--g-purple); }
  .agent-money { margin-left: auto; font: 700 14px var(--mono); color: var(--green-ink); }
  .agent-title { font-size: 17px; font-weight: 700; margin: 0 0 6px; color: var(--text); }
  .agent-one-line { font-size: 13.5px; color: var(--text-muted); line-height: 1.5; margin: 0; }
  .agent-foot-row { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px dashed var(--border); font-size: 12px; color: var(--text-dim); width: 100%; }
  .agent-open::after { content: "Inspect Reads / Does / Stops At \2193"; font: 600 11.5px var(--font); color: var(--accent); }
  .agent.is-open .agent-open::after { content: "Collapse \2191"; }

  .agent-detail { display: none; border-top: 1px solid var(--border); padding: 20px 22px; background: var(--surface-sunk); grid-template-columns: 1.55fr 1fr; gap: 22px; }
  .agent.is-open .agent-detail { display: grid; }
  @media (max-width: 900px) { .agent.is-open .agent-detail { grid-template-columns: 1fr; } }
  .spec { display: grid; gap: 10px; }
  .spec-row { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 12px; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; }
  .spec-k { font: 700 10.5px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); padding-top: 2px; }
  .guard { padding: 11px 14px; border-radius: 10px; border: 1px dashed var(--border-strong); background: var(--surface); margin-bottom: 10px; }
  .guard-key { display: block; font: 700 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 3px; }
  .guard-val { font-size: 12.5px; color: var(--text); line-height: 1.45; }
  .ge-launch { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-radius: 10px; background: var(--g-grey-1200); color: #fff; text-decoration: none; font: 600 12.5px var(--font); margin-top: 8px; }
  .ge-launch:hover { opacity: .92; }
  .demo-btn { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 14px; border-radius: 10px; background: var(--accent-soft); border: 1px solid rgba(49,134,255,.35); color: var(--accent); text-decoration: none; font: 600 12.5px var(--font); margin-top: 8px; }

  /* 4-Lever Strip & Build Portfolio */
  .bstrip, .portfolio { margin-top: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow-sm); }
  .bstrip-h, .pf-h { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; margin-bottom: 10px; }
  .bstrip-bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--surface-sunk); margin-bottom: 14px; }
  .b-prod { background: #3186FF; } .b-flow { background: #00AF57; } .b-shield { background: #4B31E3; } .b-recov { background: #12B5CB; }
  .bstrip-cells { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 780px) { .bstrip-cells { grid-template-columns: repeat(2, 1fr); } }
  .bcell { padding: 10px 12px; border-radius: 10px; background: var(--surface-sunk); }
  .bcell-key { display: block; font: 700 10.5px var(--mono); text-transform: uppercase; color: var(--text-muted); }
  .bcell-val { display: block; font: 700 18px var(--font); color: var(--text); margin: 2px 0; }
  .bcell-sub { font-size: 11.5px; color: var(--text-dim); }
  .pf-row { display: grid; grid-template-columns: 26px minmax(180px, 1.2fr) 90px minmax(120px, 1.5fr) 120px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .pf-row:last-child { border-bottom: 0; }
  @media (max-width: 820px) { .pf-row { grid-template-columns: 24px 1fr 80px; } .pf-bar, .pf-sub { display: none; } }
  .pf-rank { font: 700 12px var(--mono); color: var(--text-dim); }
  .pf-name { font-weight: 600; }
  .pf-val { font: 700 13px var(--mono); color: var(--green-ink); text-align: right; }
  .pf-bar { height: 8px; background: var(--surface-sunk); border-radius: 999px; overflow: hidden; }
  .pf-fill { display: block; height: 100%; background: linear-gradient(90deg, #3186FF, #00AF57); border-radius: 999px; }
  .pf-sub { font: 600 11px var(--mono); color: var(--text-dim); text-align: right; }

  /* Limits */
  .limits { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; }
  @media (max-width: 860px) { .limits { grid-template-columns: 1fr; } }
  .narr-h3 { margin: 0 0 10px; font: 700 11px var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--text-dim); }
  .no-list { margin: 0; padding: 0; list-style: none; }
  .no-list li { display: flex; justify-content: space-between; gap: 14px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .no-list li:last-child { border-bottom: 0; }
  .provenance { margin: 28px 0 60px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-dim); }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-in">
    <a class="mast-brand" href="index.html">
      <img class="mast-logo" src="../assets/media/wip/image25.png" alt="Google Cloud">
      <span class="mast-div"></span>
      <span class="mast-kicker">CPG Persona &amp; Agent Suite Dossier</span>
    </a>
    <span class="mast-spacer"></span>
    <nav class="mast-nav">
      <button class="mast-btn" id="themeBtn" type="button">Dark</button>
      <a class="mast-btn" id="backBoard" href="index.html">&larr; Back to Persona Map</a>
      <span class="mast-count" id="counter">01 / 60</span>
      <a class="mast-cta" href="../index.html">All Slides &#8599;</a>
    </nav>
  </div>
</header>

<div class="roster">
  <div class="wrap">
    <div class="domain-row" id="domainRow"></div>
    <div class="strip" id="strip"></div>
  </div>
</div>

<main class="wrap" id="root"></main>

<script src="../data/sc_story_data.js"></script>
<script src="../data/sc_value_model.js"></script>
<script>
(function () {
  var DATA = window.SC_DATA;
  var personas = DATA.personas;
  var depts = DATA.departments;

  var themeBtn = document.getElementById('themeBtn');
  function syncThemeBtn() { themeBtn.textContent = document.documentElement.classList.contains('theme-dark') ? 'Light' : 'Dark'; }
  syncThemeBtn();
  themeBtn.addEventListener('click', function () {
    var dark = document.documentElement.classList.toggle('theme-dark');
    document.documentElement.classList.toggle('theme-light', !dark);
    try { localStorage.setItem('deck-theme', dark ? 'dark' : 'light'); } catch (e) {}
    syncThemeBtn();
  });

  var qs = new URLSearchParams(location.search);
  var currentId = qs.get('id') || personas[0].id;
  var openAgentId = qs.get('agent') || '';
  var activeDept = qs.get('dept') || 'all';
  var searchQuery = '';

  if (!personas.some(function (p) { return p.id === currentId; })) currentId = personas[0].id;

  function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function initials(name) {
    return String(name || '').split(/\s+/).slice(0, 2).map(function (w) { return w[0] || ''; }).join('').toUpperCase();
  }

  function renderRoster() {
    var dHtml = '<button type="button" class="fchip' + (activeDept === 'all' ? ' is-on' : '') + '" data-dept="all">All 6 Pillars (' + personas.length + ')</button>';
    depts.forEach(function (d) {
      dHtml += '<button type="button" class="fchip' + (activeDept === d.id ? ' is-on' : '') + '" data-dept="' + d.id + '">' + d.num + ' · ' + esc(d.title) + ' (' + d.personaCount + ')</button>';
    });
    dHtml += '<input type="search" class="fsearch" id="pSearch" placeholder="Search person, role or agent..." value="' + esc(searchQuery) + '">';
    var dRow = document.getElementById('domainRow');
    dRow.innerHTML = dHtml;

    dRow.querySelectorAll('.fchip').forEach(function (b) {
      b.addEventListener('click', function () {
        activeDept = b.dataset.dept;
        var filtered = getFiltered();
        if (filtered.length && !filtered.some(function (x) { return x.id === currentId; })) currentId = filtered[0].id;
        renderRoster();
        renderPersona();
      });
    });
    document.getElementById('pSearch').addEventListener('input', function (e) {
      searchQuery = e.target.value.trim().toLowerCase();
      renderStripOnly();
    });
    renderStripOnly();
  }

  function getFiltered() {
    return personas.filter(function (p) {
      if (activeDept !== 'all' && p.deptId !== activeDept) return false;
      if (!searchQuery) return true;
      var hay = (p.personName + ' ' + p.name + ' ' + p.subPillarName + ' ' + p.agentSuite.map(function (s) { return s.name; }).join(' ')).toLowerCase();
      return hay.indexOf(searchQuery) >= 0;
    });
  }

  function renderStripOnly() {
    var list = getFiltered();
    var strip = document.getElementById('strip');
    strip.innerHTML = list.map(function (p) {
      return '<button type="button" class="pchip' + (p.id === currentId ? ' is-on' : '') + '" data-id="' + p.id + '">' +
        '<span class="pchip-av" style="background:' + p.deptColor + '">' + initials(p.personName) + '</span>' +
        '<span>' + esc(p.personName) + ' <span class="pchip-sub">· ' + esc(p.name) + '</span></span>' +
      '</button>';
    }).join('');
    strip.querySelectorAll('.pchip').forEach(function (b) {
      b.addEventListener('click', function () {
        currentId = b.dataset.id;
        openAgentId = '';
        history.replaceState(null, '', '?id=' + encodeURIComponent(currentId) + (activeDept !== 'all' ? '&dept=' + activeDept : ''));
        renderStripOnly();
        renderPersona();
      });
    });
  }

  function renderPersona() {
    var idx = personas.findIndex(function (x) { return x.id === currentId; });
    var p = personas[Math.max(0, idx)];
    var firstName = p.personName.split(' ')[0];
    document.title = p.personName + ' (' + p.name + ') — CPG Agent Suite';
    document.getElementById('counter').textContent = p.code + ' / ' + personas.length;
    document.getElementById('backBoard').href = 'index.html' + (activeDept !== 'all' ? '?dept=' + encodeURIComponent(activeDept) : '');

    function fmtINR(cr, sfx) {
      var suffix = sfx || '';
      var n = Number(cr) || 0;
      if (n <= 0) return '—';
      if (n >= 1000) return '₹' + n.toLocaleString('en-IN', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' Cr' + suffix;
      if (n >= 1) return '₹' + n.toFixed(1) + ' Cr' + suffix;
      return '₹' + Math.max(1, Math.round(n * 100)) + ' L' + suffix;
    }

    var v = p.val || { prod: 0.6, flow: 7.2, shield: 7.2, recov: 3.6, total: 18.6 };
    var tot = Math.max(0.1, v.total);
    var suite = p.agentSuite || [];

    var suiteCardsHtml = suite.map(function (a, i) {
      var shouldOpen = openAgentId ? (a.id === openAgentId) : (i === 0);
      var pBadge = a.priorityTier === 'P0'
        ? '<span class="badge-p0">P0 · Deploy First (' + a.paybackDays + 'd)</span>'
        : (a.priorityTier === 'P1' ? '<span class="badge-p1">P1 · Build Next</span>' : '<span class="badge-id">P2 · Enabler</span>');
      var newBadge = a.isNewCpgAgent ? '<span class="badge-new">+ NEW CPG AGENT</span>' : '';
      var liveBadge = a.liveInGE ? '<span class="tag tag-live" style="padding:2px 8px;font-size:10px">&#9679; Live in GE</span>' : '';

      return '<article class="agent' + (shouldOpen ? ' is-open' : '') + '" data-aid="' + esc(a.id) + '">' +
        '<button class="agent-head" type="button" aria-expanded="' + (shouldOpen ? 'true' : 'false') + '">' +
          '<div style="width:100%">' +
            '<div class="agent-badges">' +
              '<span class="badge-id">' + esc(a.code) + '</span>' +
              pBadge + newBadge + liveBadge +
              '<span class="agent-money">' + fmtINR(a.annualValueCr) + '<small style="font-weight:400;font-size:11px">/yr</small></span>' +
            '</div>' +
            '<h3 class="agent-title">' + esc(a.name) + '</h3>' +
            '<p class="agent-one-line">' + esc(a.oneLine) + '</p>' +
          '</div>' +
          '<div class="agent-foot-row">' +
            '<span>Returns ~<b>' + a.roleShareHrs + ' hrs/wk</b> to ' + esc(firstName) + '</span>' +
            '<span class="agent-open"></span>' +
          '</div>' +
        '</button>' +
        '<div class="agent-detail">' +
          '<div class="detail-main">' +
            '<div class="spec">' +
              '<div class="spec-row"><span class="spec-k">Reads</span><span>' + esc(a.reads) + '</span></div>' +
              '<div class="spec-row"><span class="spec-k">Does</span><span>' + esc(a.does) + '</span></div>' +
              '<div class="spec-row"><span class="spec-k">Returns</span><span>' + esc(a.returns) + '</span></div>' +
            '</div>' +
          '</div>' +
          '<div class="detail-side">' +
            '<div class="guard"><span class="guard-key">Stops At (Human Sign-Off)</span><span class="guard-val">' + esc(a.stopsAt) + '</span></div>' +
            '<div class="guard"><span class="guard-key">Safety Envelope</span><span class="guard-val">' + esc(a.safetyEnvelope) + '</span></div>' +
            '<a class="demo-btn" href="../pages/demo_stage.html?agent=' + encodeURIComponent(a.id) + '"><span>&#9654; Open in Demo Video Stage</span><span>&rarr;</span></a>' +
            '<a class="ge-launch" target="_blank" rel="noopener noreferrer" href="' + esc(a.geUrl) + '">' +
              '<span>' + (a.liveInGE ? '&#10022; Run Live in Gemini Enterprise' : '&#10022; Open Gemini Enterprise Workspace (P0 Staged)') + '</span>' +
              '<span>&#8599;</span>' +
            '</a>' +
          '</div>' +
        '</div>' +
      '</article>';
    }).join('');

    var sortedSuite = suite.slice().sort(function (a, b) { return b.annualValueCr - a.annualValueCr; });
    var topVal = (sortedSuite[0] && sortedSuite[0].annualValueCr) || 1;
    var pfRows = sortedSuite.map(function (a, i) {
      var wPct = Math.max(8, (a.annualValueCr / topVal) * 100);
      return '<div class="pf-row">' +
        '<span class="pf-rank">#' + (i + 1) + '</span>' +
        '<span class="pf-name">' + esc(a.name) + (a.isNewCpgAgent ? ' <small style="color:var(--g-purple);font-family:var(--mono)">[NEW]</small>' : '') + '</span>' +
        '<span class="pf-val">' + fmtINR(a.annualValueCr, '/yr') + '</span>' +
        '<span class="pf-bar"><span class="pf-fill" style="width:' + wPct.toFixed(1) + '%"></span></span>' +
        '<span class="pf-sub">' + esc(a.priorityTier) + ' · ' + a.paybackDays + 'd payback</span>' +
      '</div>';
    }).join('');

    document.getElementById('root').innerHTML =
      '<section class="idcard">' +
        '<div>' +
          '<div class="portrait-mono" style="background:' + p.deptColor + '">' + initials(p.personName) + '</div>' +
          '<div class="figure">' +
            '<div class="figure-key">Role Annual Value</div>' +
            '<div class="figure-val">' + fmtINR(v.total, '/yr') + '</div>' +
            '<div class="figure-sub">across 4 value levers<br><b>' + p.toilHoursBefore + 'h &rarr; ' + p.toilHoursAfter + 'h/wk</b> manual toil</div>' +
          '</div>' +
        '</div>' +
        '<div class="idhead">' +
          '<div class="idmeta">' +
            '<span class="tag">' + esc(p.code) + '</span>' +
            (p.priorityTier === 'P0' ? '<span class="tag tag-p0">Priority 0 · Immediate Cash/Risk</span>' : '<span class="tag">' + esc(p.priorityTier) + ' Tier</span>') +
            '<span class="tag tag-live">' + suite.length + ' Agents in Suite</span>' +
            '<span class="tag">' + esc(p.deptTitle) + ' &middot; ' + esc(p.subPillarName) + '</span>' +
            '<span class="tag">&#128205; ' + esc(p.setting) + '</span>' +
          '</div>' +
          '<h1>' + esc(p.personName) + '</h1>' +
          '<p class="id-role">' + esc(p.name) + '</p>' +
          '<p class="id-line">' + esc(p.whatTheyDo) + '</p>' +
          '<div class="id-mandate"><b>Why this role matters in CPG:</b> ' + esc(p.whyItMatters) + '</div>' +
          '<div class="sys-line"><b>Systems touched:</b> ' + esc(p.systemsTouched) + '</div>' +
        '</div>' +
      '</section>' +

      '<section class="block">' +
        '<div class="section-head">' +
          '<h2>The Agent Suite ' + esc(firstName) + ' Uses (' + suite.length + ' Specialized Agents)</h2>' +
          '<span class="section-note">Click any agent card to inspect what data it reads, what math it runs, and where human sign-off takes over.</span>' +
        '</div>' +
        '<div class="squad">' + suiteCardsHtml + '</div>' +

        '<div class="bstrip">' +
          '<div class="bstrip-h"><span>How ' + esc(firstName) + '\'s suite creates value</span><span style="color:var(--green-ink)">' + fmtINR(v.total, ' / yr modeled') + '</span></div>' +
          '<div class="bstrip-bar">' +
            '<span class="b-prod" style="width:' + ((v.prod / tot) * 100).toFixed(1) + '%"></span>' +
            '<span class="b-flow" style="width:' + ((v.flow / tot) * 100).toFixed(1) + '%"></span>' +
            '<span class="b-shield" style="width:' + ((v.shield / tot) * 100).toFixed(1) + '%"></span>' +
            '<span class="b-recov" style="width:' + ((v.recov / tot) * 100).toFixed(1) + '%"></span>' +
          '</div>' +
          '<div class="bstrip-cells">' +
            '<div class="bcell"><span class="bcell-key">Productivity</span><span class="bcell-val">' + fmtINR(v.prod) + '</span><span class="bcell-sub">' + p.savedHrs + ' hrs/wk redeployed</span></div>' +
            '<div class="bcell"><span class="bcell-key">Flow &amp; Working Capital</span><span class="bcell-val">' + fmtINR(v.flow) + '</span><span class="bcell-sub">' + (v.flow ? 'MEIO, FEFO &amp; OEE flow' : 'No physical stock held here') + '</span></div>' +
            '<div class="bcell"><span class="bcell-key">Leakage &amp; Risk Shield</span><span class="bcell-val">' + fmtINR(v.shield) + '</span><span class="bcell-sub">' + (v.shield ? 'Audit, promo &amp; fine shield' : 'No direct leakage exposure') + '</span></div>' +
            '<div class="bcell"><span class="bcell-key">Revenue &amp; Salvage</span><span class="bcell-val">' + fmtINR(v.recov) + '</span><span class="bcell-sub">' + (v.recov ? 'OSA lift &amp; salvage margin' : 'Back-office governance role') + '</span></div>' +
          '</div>' +
        '</div>' +

        '<div class="portfolio">' +
          '<div class="pf-h"><span>Which agent in ' + esc(firstName) + '\'s suite to build first</span><span style="font-size:12px;color:var(--text-dim)">Ranked by standalone CPG value &amp; payback speed</span></div>' +
          pfRows +
        '</div>' +
      '</section>' +

      '<section class="block">' +
        '<div class="section-head"><h2>Where the Agent Suite Stops</h2><span class="section-note">Every agent prepares and stages; accountability stays human.</span></div>' +
        '<div class="limits">' +
          '<div><h3 class="narr-h3">Not ' + esc(firstName) + '\'s / AI\'s unilateral call</h3><ul class="no-list">' +
            (p.notOwned || []).map(function (n) { return '<li><span>' + esc(n.task) + '</span><b>' + esc(n.owner) + '</b></li>'; }).join('') +
          '</ul></div>' +
          '<div><h3 class="narr-h3">The Honest Boundary</h3><p style="margin:0;font-size:13.5px;color:var(--text-muted);line-height:1.6">' + esc(p.honestLimit) + '</p></div>' +
        '</div>' +
      '</section>' +

      '<p class="provenance"><b>' + esc(p.personName) + '</b> &middot; ' + esc(p.name) + ' &middot; ' + suite.length + ' agents in suite &middot; CPG Multi-Echelon Supply Chain Benchmark (ICML Plants, CFA Depots, General Trade DMS, Modern Trade &amp; Quick-Commerce).</p>';

    document.querySelectorAll('#root .agent-head').forEach(function (btnEl) {
      btnEl.addEventListener('click', function () {
        var card = btnEl.closest('.agent');
        var open = card.classList.toggle('is-open');
        btnEl.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    });

    if (openAgentId) {
      var target = document.querySelector('.agent[data-aid="' + openAgentId + '"]');
      if (target) setTimeout(function () { target.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 80);
    }
  }

  renderRoster();
  renderPersona();
})();
</script>
</body>
</html>
